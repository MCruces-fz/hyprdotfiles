[opener]
play = [
	{
		desc = "Play with mpv", 
		run = 'mpv --player-operation-mode=pseudo-gui "%s"', 
		orphan = true, 
		for = "unix" 
	},
	{
		desc = "Play directory (Skip GoPro junk)", 
		run = 'mpv --player-operation-mode=pseudo-gui --image-display-duration=inf "%d1"',
		orphan = true, 
		for = "unix" 
	}
]
edit = [
	{
		desc = "Edit with nvim", 
		run = 'nvim "%s"', 
		block = true, 
		for = "unix" 
	},
	{
		desc = "Edit with gedit", 
		run = 'gedit "%s"', 
		orphan = true,
		block = false, 
		for = "unix" 
	},
]
read_pdf = [
	{
		desc = "Read PDF (zathura)",
		run = 'zathura "%s"',
		orphan = true, 
		for = "unix"
	}
]
open_img = [
	{
		desc = "View with nomacs", 
		run = 'nomacs "%s"', 
		orphan = true, 
		block = false, 
		for = "unix" 
	},
	{
		desc = "View/edit with satty", 
		run = 'satty --filename "%s"', 
		orphan = true, 
		block = false, 
		for = "unix" 
	},
	{ 
		desc = "Edit with GIMP", 
		run = 'gimp "%s"', 
		orphan = true, 
		block = false, 
		for = "unix" 
	},
]
launch = [
	{ 
		desc = "Launch GTK App", 
		run = 'gtk-launch "%s"', 
		orphan = true, 
		for = "unix" 
	}
]
open = [
	{
		desc = "Open XDG open",
		run = 'xdg-open "%s"',
		for = "unix"
	},
]

[open]
prepend_rules = [
# append_rules = [
	# Plain Text
	{ mime = "text/*",  use = "edit" },

	# Media
	{ mime = "audio/*", use = "play" },
	{ mime = "video/*", use = "play" },
	# { url = "*.mp3", use = "play" },
	# { url = "*.ogg", use = "play" },

	{ mime = "image/*", use = "open_img" },

	# Apps
	{ url = "*.desktop", use = ["launch", "edit"] },


	# Multiple openers for a single rule
	{ mime = "text/html", use = [ "open", "edit" ] },

	# { url = "*.pdf", use = ["read_pdf", "open_img"] },
	{ mime = "application/pdf", use = "read_pdf" },
]

# append_rules = [
# 	{ url = "*", use = [ "open", "reveal" ] },
# ]

[mgr]
ratio=[1, 4, 3] # 1/8, 4/8, 3/8
