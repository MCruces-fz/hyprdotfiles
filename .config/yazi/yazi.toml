[opener]
play = [
	{ run = 'mpv --player-operation-mode=pseudo-gui "$@"', desc = "Play with mpv", orphan = true, for = "unix" },
]
edit = [
	{ run = 'nvim "$@"', desc = "Edit with nvim", block = true, for = "unix" },
]
open = [
	{ run = 'xdg-open "$@"', desc = "Open XDG open", for = "unix" },
]
read_pdf = [
	{ run = 'zathura "$@"' , desc = "Read PDF", orphan = true, for = "unix"}
]
open_img = [
	{ run = 'satty --filename "$@"', desc = "View image", orphan = true, for = "unix" }
]
edit_img = [
	{ run = 'gimp "$@"', desc = "Edit with GIMP", orphan = true, for = "unix" }
]
launch = [
	{ run = 'gtk-launch "$@"', desc = "Launch App", orphan = true, for = "unix" }
]

[open]
prepend_rules = [
	# Plain Text
	{ name = "*.json", use = "edit" },
	{ name = "*.tex", use = "edit" },
	{ name = "*.md", use = "edit" },
	{ name = "*.txt", use = "edit" },

	# Media
	{ name = "*.mp3", use = "play" },
	{ name = "*.ogg", use = "play" },

	{ name = "*.png", use = ["open_img", "edit_img"] },
	{ name = "*.jpg", use = ["open_img", "edit_img"] },
	{ name = "*.jpeg", use = ["open_img", "edit_img"] },

	# Apps
	{ name = "*.desktop", use = ["launch", "edit"] },


	# Multiple openers for a single rule
	{ name = "*.html", use = [ "open", "edit" ] },

	{ name = "*.pdf", use = "read_pdf" },
]

