general {
	lock_cmd = pidof hyprlock || hyprlock --quiet
}

# Screen Off
listener {
    timeout = 420 # 7 minutes
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}

# Suspend
listener {
    timeout = 900 # 15 min
    on-timeout = systemctl suspend
}

# NOTE: to keep active while playing music, do the following.
# Install package wayland-pipewire-idle-inhibit and add to hyprland start -> hl.exec_cmd("wayland-pipewire-idle-inhibit")
