[opener]
play = [
	{
		desc = "Play with mpv", 
		run = 'mpv --player-operation-mode=pseudo-gui "$@"', 
		orphan = true, 
		for = "unix" 
	},
]
edit = [
	{
		desc = "Edit with nvim", 
		run = 'nvim "$@"', 
		block = true, 
		for = "unix" 
	},
	{
		desc = "Edit with gedit", 
		run = 'gedit "$@"', 
		orphan = true,
		block = false, 
		for = "unix" 
	},
]
read_pdf = [
	{
		desc = "Read PDF (zathura)",
		run = 'zathura "$@"',
		orphan = true, 
		for = "unix"
	}
]
open_img = [
	{
		desc = "View with nomacs", 
		run = 'nomacs "$@"', 
		orphan = true, 
		block = false, 
		for = "unix" 
	},
	{
		desc = "View/edit with satty", 
		run = 'satty --filename "$@"', 
		orphan = true, 
		block = false, 
		for = "unix" 
	},
	{ 
		desc = "Edit with GIMP", 
		run = 'gimp "$@"', 
		orphan = true, 
		block = false, 
		for = "unix" 
	},
]
launch = [
	{ 
		desc = "Launch GTK App", 
		run = 'gtk-launch "$@"', 
		orphan = true, 
		for = "unix" 
	}
]
open = [
	{
		desc = "Open XDG open",
		run = 'xdg-open "$@"',
		for = "unix"
	},
]

[open]
prepend_rules = [
	# Plain Text
	{ mime = "text/*",  use = "edit" },

	# Media
	{ mime = "audio/*", use = "play" },
	{ mime = "video/*", use = "play" },
	# { url = "*.mp3", use = "play" },
	# { url = "*.ogg", use = "play" },

	{ mime = "image/*", use = "open_img" },

	# Apps
	{ url = "*.desktop", use = ["launch", "edit"] },


	# Multiple openers for a single rule
	{ url = "*.html", use = [ "open", "edit" ] },

	# { name = "*.pdf", use = "read_pdf" },
	{ mime = "application/pdf", use = "read_pdf" },
]

append_rules = [
	{ name = "*", use = ["open"] },
]
